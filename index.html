<style>
/* Layout: one 9:16 "screen" centered on a dark desk; overlays (folder, scan, dossier) sit on top of the cartoon */
:root{
  --desk:#17120f; --kraft:#d6b273; --kraft-dark:#a9854a; --ink:#3a2a1c;
  --stamp:#c8323a; --term:#06110b; --term-fg:#59f29a; --paper:#f1e8d4;
  --hand:'Neucha','Comic Sans MS',cursive; --mono:'PT Mono',ui-monospace,monospace; --heavy:'Rubik Mono One','Arial Black',sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--desk);display:flex;align-items:center;justify-content:center;box-sizing:border-box;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#stage{position:relative;width:min(100%,calc((100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)) * 9 / 16));
  aspect-ratio:9/16;max-width:100%;container-type:size;overflow:hidden;border-radius:14px;background:#000}
#s{position:absolute;inset:0;width:100%;height:100%;display:block}
.layer{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4cqh;text-align:center}
.layer[hidden]{display:none!important}

/* cartoon */
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.head{transform-box:fill-box;transform-origin:50% 85%;animation:tilt 3.6s ease-in-out infinite}
@keyframes tilt{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.ear{transform-box:fill-box;transform-origin:50% 100%;animation:ear 3s ease-in-out infinite}
@keyframes ear{50%{transform:rotate(6deg)}}
#card,.fan,#zap,#ztip{transform-box:fill-box;transform-origin:center}
.fan{transform-origin:50% 100%;cursor:pointer}
.glasses{opacity:0}
.cardtext{font-family:var(--hand);fill:var(--ink);text-anchor:middle}
#s:not(.mib) .agent{display:none}
#s.mib .day{display:none}

/* folder */
#folder{background:radial-gradient(circle at 50% 40%,#3a2b20,var(--desk));cursor:pointer;perspective:900px}
.folder{position:relative;width:78cqw;aspect-ratio:4/3;background:var(--kraft);border-radius:2cqw;box-shadow:0 3cqw 6cqw #0008;
  transform-style:preserve-3d;transition:transform .8s ease-in}
.folder::before{content:"";position:absolute;left:4cqw;top:-4cqw;width:26cqw;height:5cqw;background:var(--kraft);border-radius:2cqw 2cqw 0 0}
.cover{position:absolute;inset:0;background:var(--kraft);border-radius:2cqw;transform-origin:left;transition:transform .9s ease-in-out;
  display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6cqw;font-family:var(--mono);color:var(--ink);
  box-shadow:inset 0 0 0 .5cqw var(--kraft-dark);backface-visibility:hidden}
.cover small{font-size:3.4cqw;letter-spacing:.1em}
.cover b{font-size:5cqw}
.secret{font-family:var(--heavy);color:var(--stamp);border:.8cqw solid var(--stamp);padding:1.5cqw 3cqw;font-size:6.5cqw;transform:rotate(-8deg);opacity:.85}
#folder.open .cover{transform:rotateY(-170deg)}
#folder.open .folder{transform:scale(1.6);transition-delay:.5s}
.hint{font-family:var(--mono);color:var(--kraft);font-size:3.8cqw;letter-spacing:.08em;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}

/* scan */
#scan{background:var(--term);color:var(--term-fg);font-family:var(--mono);touch-action:none}
#scan h2{margin:0;font-size:5cqw;font-weight:400;letter-spacing:.12em;text-wrap:balance;padding:0 6cqw}
#scan p{margin:0;font-size:3.8cqw;min-height:2.6em;padding:0 8cqw;opacity:.85}
.fp{width:40cqw;color:var(--term-fg);filter:drop-shadow(0 0 2cqw #59f29a88);cursor:pointer}
.scanline{opacity:0}
#scan.holding .scanline{opacity:1;animation:sweep .9s linear infinite alternate}
@keyframes sweep{to{transform:translateY(146px)}}
.bar{width:60cqw;height:2.2cqw;border:1px solid var(--term-fg);border-radius:2cqw;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--term-fg)}
#scan.ok{color:#fff}

/* transitions */
#flash{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2}
#flash .rays,#flash .burst{position:absolute;left:var(--fx,50%);top:var(--fy,50%);width:60cqw;height:60cqw;margin:-30cqw 0 0 -30cqw;border-radius:50%;transform:scale(0)}
#flash .burst{background:radial-gradient(circle,#fff 0 30%,#eaf7ff 50%,#bfe6ff00 70%)}
#flash .rays{background:repeating-conic-gradient(#fff 0 5deg,#fff0 5deg 15deg);
  -webkit-mask:radial-gradient(circle,#000 15%,#0000 70%);mask:radial-gradient(circle,#000 15%,#0000 70%)}
#flash .white{position:absolute;inset:0;background:radial-gradient(circle at var(--fx,50%) var(--fy,50%),#fff 40%,#eef8ff);opacity:0}
#access{background:#000;color:var(--term-fg);font-family:var(--mono);font-size:6cqw;letter-spacing:.15em}

/* dossier */
#dossier{background:radial-gradient(circle at 50% 30%,#3a2b20,var(--desk));gap:6cqh;z-index:3}
.fin{font-family:var(--hand);color:var(--paper);font-size:6.5cqw}
.sheet{position:relative;width:82cqw;background:var(--paper);color:var(--ink);font-family:var(--mono);text-align:left;
  padding:6cqw 6cqw 24cqw;box-sizing:border-box;box-shadow:0 3cqw 6cqw #0009;transform:rotate(-1.5deg)}
.sheet h3{margin:0 0 1cqw;font-family:var(--heavy);font-size:5cqw;font-weight:400;text-wrap:balance}
.sheet .sub{font-size:3.2cqw;opacity:.65;margin-bottom:4cqw;letter-spacing:.08em}
.row{display:flex;justify-content:space-between;gap:3cqw;font-size:3.8cqw;padding:2cqw 0;border-bottom:1px dashed #3a2a1c55}
.row span:last-child{text-align:right}
#bigstamp{position:absolute;right:6cqw;bottom:5cqw;font-family:var(--heavy);color:var(--stamp);border:1cqw solid var(--stamp);
  padding:2cqw 3cqw;font-size:6cqw;line-height:1.1;text-align:center;transform:rotate(-10deg) scale(3);opacity:0;pointer-events:none}
.btn{font-family:var(--mono);font-size:4cqw;background:var(--stamp);color:#fff;border:0;border-radius:1.5cqw;padding:3cqw 6cqw;cursor:pointer;letter-spacing:.06em}
.btn.ghost{background:transparent;border:1px solid var(--kraft);color:var(--kraft)}
.link{background:none;border:0;color:var(--kraft);font-family:var(--mono);font-size:3.4cqw;text-decoration:underline;text-underline-offset:3px;cursor:pointer;opacity:.8}
.moved s{text-decoration-color:var(--stamp);text-decoration-thickness:2px}
.moved em{font-family:var(--hand);font-style:normal;color:var(--stamp);font-size:1.15em;margin-left:1.5cqw}
.btn:focus-visible,.link:focus-visible,#mute:focus-visible{outline:2px solid #fff;outline-offset:3px}
#mute{position:absolute;top:2.5cqw;right:2.5cqw;z-index:5;width:10cqw;height:10cqw;border-radius:50%;border:0;cursor:pointer;
  background:#0006;color:#fff;font-size:5cqw;line-height:1}
#mute.off{opacity:.5;text-decoration:line-through}

@media (prefers-reduced-motion:reduce){.bob,.head,.ear,.hint{animation:none}}
</style>

<div id="stage">
  <svg id="s" viewBox="0 0 540 960" xmlns="http://www.w3.org/2000/svg"></svg>

  <div id="folder" class="layer" role="button" tabindex="0" aria-label="Открыть секретную папку">
    <div class="folder"><div class="cover">
      <small>ДЕЛО № 0711</small>

  </div>

  <div id="scan" class="layer" hidden>
    <h2>ПОДТВЕРДИТЕ ЛИЧНОСТЬ АГЕНТА</h2>
    <svg class="fp" id="fp" viewBox="-60 -75 120 150" aria-label="Отпечаток пальца"></svg>
    <div class="bar"><i id="prog"></i></div>
    <p id="scanmsg">Приложи палец и держи</p>
  </div>

  <div id="access" class="layer" hidden></div>
  <div id="flash"><div class="rays"></div><div class="burst"></div><div class="white"></div></div>

  <div id="dossier" class="layer" hidden>
    <div class="sheet">
      <h3>ОПЕРАЦИЯ «<span id="opname">СУББОТА</span>»</h3>
      <div class="sub">СТРОГО СЕКРЕТНО · ДЛЯ АГЕНТА КСЮШИ</div>
      <div class="row"><span>День</span><span id="day">суббота</span></div>
      <div class="row"><span>Этап 1</span><span>спа</span></div>
      <div class="row"><span>Этап 2</span><span>хинкали</span></div>
      <div class="row"><span>Участники</span><span>два тайных спецагента</span></div>
      <div class="row"><span>Статус</span><span id="status">ждёт печати</span></div>
      <div id="bigstamp">МИССИЯ<br>ПРИНЯТА</div>
    </div>
    <button class="btn" id="stampBtn" type="button">Поставить печать</button>
    <button class="link" id="move" type="button">Суббота не подходит? Запросить перенос</button>

  </div>

  <button id="mute" aria-label="Звук">♪</button>
</div>

<script>
// ---------- sound: everything is synthesized, no files ----------
let ac, master, music, nbuf, distCurve, muted = false;
const tracks = new Set();
const mtof = m => 440 * 2 ** ((m - 69) / 12);

function initAudio() {
  if (ac) { ac.resume(); return; }
  try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch { return; }
  const comp = ac.createDynamicsCompressor();
  master = ac.createGain(); master.gain.value = muted ? 0 : .8;
  master.connect(comp).connect(ac.destination);
  music = ac.createGain(); music.gain.value = .55; music.connect(master);
  nbuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
  const ch = nbuf.getChannelData(0); for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
  distCurve = new Float32Array(256).map((_, i) => Math.tanh(3 * (i / 128 - 1)));
  setInterval(schedule, 25);
}

function tone(t, hz, dur, {type = 'sine', vol = .2, at = .005, out = music, hzEnd} = {}) {
  if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(hz, t);
  if (hzEnd) o.frequency.exponentialRampToValueAtTime(hzEnd, t + dur * .6);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + at); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g).connect(out); o.start(t); o.stop(t + dur + .05);
}
function noise(t, dur, {vol = .3, type = 'highpass', f = 6000, fEnd, q = 1, out = music} = {}) {
  if (!ac) return;
  const s = ac.createBufferSource(), fl = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = nbuf; fl.type = type; fl.Q.value = q; fl.frequency.setValueAtTime(f, t);
  if (fEnd) fl.frequency.exponentialRampToValueAtTime(fEnd, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  s.connect(fl).connect(g).connect(out); s.start(t); s.stop(t + dur);
}
function bass(t, m, dur, out = music, vol = .35) {
  const o = ac.createOscillator(), ws = ac.createWaveShaper(), lp = ac.createBiquadFilter(), g = ac.createGain();
  o.type = 'sawtooth'; o.frequency.value = mtof(m); ws.curve = distCurve; lp.type = 'lowpass'; lp.frequency.value = 1100;
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .01); g.gain.setTargetAtTime(.0001, t + dur * .8, .05);
  o.connect(ws).connect(lp).connect(g).connect(out); o.start(t); o.stop(t + dur + .4);
}
const kick = (t, out = music, vol = .9) => tone(t, 150, .35, {vol, out, hzEnd: 40});
const snare = (t, out) => { noise(t, .18, {vol: .35, type: 'bandpass', f: 1800, q: .7, out}); tone(t, 190, .1, {vol: .2, type: 'triangle', out}); };

// music-box lullaby, C major
const MEL = [[0,76,4],[4,79,4],[8,84,6],[14,83,2],[16,81,4],[20,79,4],[24,76,8],
             [32,77,4],[36,81,4],[40,84,4],[44,81,4],[48,79,6],[54,77,2],[56,76,4],[60,74,4]];
const CH = [[60,64,67],[57,60,64],[53,57,60],[55,59,62]];
const lullaby = {bpm: 92, len: 64, fn(step, t, out) {
  const sp = 60 / 92 / 4, s = step % 16, ch = CH[step / 16 | 0];
  MEL.filter(n => n[0] === step).forEach(([, n, l]) => {
    tone(t, mtof(n), l * sp + .6, {vol: .16, out});
    tone(t, mtof(n + 12), l * sp * .6 + .3, {type: 'triangle', vol: .03, out});
  });
  if (s === 0) tone(t, mtof(ch[0] - 12), sp * 14, {type: 'triangle', vol: .12, out});
  if (s % 4 === 2) tone(t, mtof(ch[(s / 4 | 0) % 3]), sp * 3, {type: 'triangle', vol: .05, out});
}};

// spy groove, E minor
const RIFF = [[0,40,2],[3,40,1],[4,43,2],[6,40,1],[8,46,2],[10,45,2],[12,43,2],[14,38,2]];
const LEAD = {0: [71, 2], 2: [70, 2], 4: [71, 6]};
const spy = {bpm: 120, len: 64, fn(step, t, out) {
  const sp = 60 / 120 / 4, s = step % 16, bar = step / 16 | 0;
  RIFF.filter(r => r[0] === s).forEach(([, n, l]) => bass(t, n, l * sp, out));
  if ([0, 8, 10].includes(s)) kick(t, out);
  if (s === 4 || s === 12) snare(t, out);
  if (s % 2 === 0) noise(t, .04, {vol: .08, f: 8000, out});
  if (bar % 2 === 1 && LEAD[s]) tone(t, mtof(LEAD[s][0]), LEAD[s][1] * sp, {type: 'square', vol: .06, out});
}};

function play(def, at) {
  if (!ac) return null;
  const tr = {...def, step: 0, next: at ?? ac.currentTime + .05, gain: ac.createGain()};
  tr.gain.connect(music); tracks.add(tr); return tr;
}
function stopTrack(tr, fade = .3) {
  if (!tr || !ac) return;
  tracks.delete(tr);
  tr.gain.gain.setTargetAtTime(0, ac.currentTime, fade / 3);
  setTimeout(() => tr.gain.disconnect(), fade * 1000 + 500);
}
function schedule() {
  for (const tr of tracks) while (tr.next < ac.currentTime + .15) {
    tr.fn(tr.step % tr.len, tr.next, tr.gain);
    tr.next += 60 / tr.bpm / 4; tr.step++;
  }
}
function spyIntro(t0) {
  kick(t0, music, 1.2); bass(t0, 28, .7, music, .5); noise(t0, 1.2, {vol: .25, f: 5000});
  const t1 = t0 + .75;
  [0, .125, .25].forEach(d => bass(t1 + d, 40, .1, music, .45));
  bass(t1 + .375, 28, .7, music, .55); kick(t1 + .375, music, 1.2); noise(t1 + .375, .9, {vol: .2, f: 4000});
}
const now = () => ac ? ac.currentTime : 0;
const sfx = {
  paper: () => noise(now(), .4, {vol: .15, type: 'bandpass', f: 600, fEnd: 2500, out: master}),
  pop: () => tone(now(), 900, .12, {vol: .05, out: master, hzEnd: 1400}),
  whoosh: () => noise(now(), .3, {vol: .07, type: 'bandpass', f: 700, fEnd: 3000, out: master}),
  ok: () => { tone(now(), 880, .15, {vol: .12, out: master}); tone(now() + .15, 1320, .35, {vol: .12, out: master}); },
  charge: () => { tone(now(), 400, 1, {type: 'square', vol: .05, out: master, hzEnd: 2400}); tone(now(), 1200, .05, {vol: .1, out: master}); },
  zap: () => { noise(now(), 1.4, {vol: .4, f: 2000, out: master}); tone(now(), 3000, .6, {vol: .1, out: master, hzEnd: 200}); },
  stamp: () => { kick(now(), master, 1); noise(now(), .15, {vol: .3, type: 'lowpass', f: 1200, out: master}); },
  sparkle: () => [84, 88, 91, 96].forEach((m, i) => tone(now() + i * .08, mtof(m), .4, {type: 'triangle', vol: .06, out: master}))
};
let scanOsc = null;
function scanHum(on, dur) {
  if (!ac) return;
  if (on) {
    const g = ac.createGain(); scanOsc = ac.createOscillator(); scanOsc.type = 'triangle';
    scanOsc.frequency.setValueAtTime(300, now()); scanOsc.frequency.linearRampToValueAtTime(1000, now() + dur);
    g.gain.value = .06; scanOsc.connect(g).connect(master); scanOsc.start();
  } else if (scanOsc) { scanOsc.stop(); scanOsc = null; }
}
let lulTr = null, spyTr = null;
const startLullaby = () => { if (!lulTr) lulTr = play(lullaby); };
const stopAll = (fade) => { stopTrack(lulTr, fade); stopTrack(spyTr, fade); lulTr = spyTr = null; };

const $m = document.getElementById('mute');
$m.onclick = () => {
  muted = !muted; $m.classList.toggle('off', muted);
  if (master) master.gain.setTargetAtTime(muted ? 0 : .8, ac.currentTime, .05);
};

// ---------- cartoon ----------
const T = {
  bunny:    {sp:'bunny',    fur:'#f7ecd9', light:'#fffaf0', dark:'#d8c6a8', inner:'#f3b8bd', nose:'#e39aa2', muz:'#fffdf8'},
  grey:     {sp:'bunny',    fur:'#b3adb0', light:'#d8d3d5', dark:'#8a8387', inner:'#eab3bb', nose:'#8c6a70', muz:'#eeeaeb'},
  squirrel: {sp:'squirrel', fur:'#b06a35', light:'#d08b52', dark:'#7f4520', inner:'#e3a585', nose:'#4a2a1a', muz:'#f2dcc0'},
  cat:      {sp:'cat',      fur:'#d2b48c', light:'#ecd5b2', dark:'#a5835c', inner:'#f2b6ba', nose:'#c9877a', muz:'#fbf3e6', stripe:'#97734a'}
};
const F = k => `url(#f-${k})`;
const rnd = (a, b) => a + Math.random() * (b - a);

const check = (id, base) => `<pattern id="${id}" width="12" height="12" patternUnits="userSpaceOnUse">
  <rect width="12" height="12" fill="${base}"/><rect width="6" height="12" fill="#fff" opacity=".28"/>
  <rect width="12" height="6" fill="#fff" opacity=".28"/><rect x="2.5" width="1" height="12" fill="#000" opacity=".08"/></pattern>`;
const furGrad = k => `<radialGradient id="f-${k}" cx=".4" cy=".35" r=".75">
  <stop offset="0" stop-color="${T[k].light}"/><stop offset=".6" stop-color="${T[k].fur}"/><stop offset="1" stop-color="${T[k].dark}"/></radialGradient>`;

function outfit(type, p, apron) {
  const day = type === 'overall' ? `
    <path d="M-26 -86 Q0 -94 26 -86 L32 -40 L-32 -40Z" fill="url(#${p})"/>
    <path d="M-20 -62 H20 V-40 H-20Z M-33 -44 H33 L35 -12 H4 L0 -24 L-4 -12 H-35Z" fill="#4f6fa3"/>
    <path d="M-16 -62 L-20 -86 M16 -62 L20 -86" stroke="#4f6fa3" stroke-width="6"/>
    <circle cx="-14" cy="-58" r="2.5" fill="#f1d27a"/><circle cx="14" cy="-58" r="2.5" fill="#f1d27a"/>` : `
    <path d="M-24 -86 Q0 -94 24 -86 L44 -14 Q0 -4 -44 -14Z" fill="url(#${p})"/>
    <path d="M-24 -86 Q0 -94 24 -86 L44 -14 Q0 -4 -44 -14Z" fill="url(#shade)"/>
    ${apron ? `<path d="M-18 -66 H18 L25 -18 Q0 -12 -25 -18Z" fill="#fffaf2"/>
      <path d="M0 -40 C-3 -44 -9 -42 0 -34 C9 -42 3 -44 0 -40Z" fill="#e7798d"/>` : ''}
    <ellipse cx="-10" cy="-86" rx="12" ry="7" fill="#fff"/><ellipse cx="10" cy="-86" rx="12" ry="7" fill="#fff"/>`;
  const suit = `
    <ellipse cx="-15" cy="-6" rx="15" ry="8" fill="#141418"/><ellipse cx="15" cy="-6" rx="15" ry="8" fill="#141418"/>
    <path d="M-28 -88 Q0 -95 28 -88 L36 -10 H-36Z" fill="#1c1c22"/>
    <path d="M-11 -89 L0 -58 L11 -89Z" fill="#fff"/>
    <path d="M-3 -86 H3 L5 -66 L0 -60 L-5 -66Z" fill="#0b0b0e"/>
    <path d="M-12 -89 L-2 -56 M12 -89 L2 -56" stroke="#33333c" stroke-width="2"/>`;
  return `<g class="day">${day}</g><g class="agent">${suit}</g>`;
}

function animal(kind, x, y, s, p, opt = {}) {
  const c = T[kind], d = (-Math.random() * 3).toFixed(2), f = F(kind);
  let back = '', ears = '', face = '';
  if (c.sp === 'bunny') {
    ears = [-1, 1].map((k, j) => `<g class="ear" style="animation-delay:${d - j * .8}s">

function setText(str) {
  const lines = str.split('\n');
  let size = [34, 30, 24][Math.min(lines.length, 3) - 1];
  const render = () => {
    ct.setAttribute('font-size', size.toFixed(1));
    ct.innerHTML = lines.map((l, i) => `<tspan x="0" dy="${i ? 1.15 : 0}em">${l}</tspan>`).join('');
    ct.setAttribute('y', (-38 + size * .35 - (lines.length - 1) * size * 1.15 / 2).toFixed(1));
  };
  render();
  // shrink to fit the real rendered width (emoji are wider than letters)
  const w = Math.max(...[...ct.querySelectorAll('tspan')].map(t => t.getComputedTextLength()));
  if (w > 180) { size *= 180 / w; render(); }
}

async function show(text, {hold = 1500, toss = true, onShow} = {}) {
  // keep the card hidden while its text is swapped, otherwise the old/empty card flashes for a frame
  cardEl.style.opacity = 0;
  cardEl.getAnimations().forEach(a => a.cancel());
  setText(text);
  jump(hop, 12);
  fans.forEach((f, j) => jump(f, 8, 150 + j * 80));
  sfx.pop();
  await cardEl.animate([{transform: 'translateY(40px) scale(.85)', opacity: 0}, {transform: 'none', opacity: 1}],
    {duration: 350, easing: 'cubic-bezier(.2,1.4,.4,1)', fill: 'forwards'}).finished;
  onShow && onShow();
  await wait(hold);
  if (!toss) return;
  // fallen cards land low and off to the sides, behind the bunny, so they never cover the next card
  const dir = Math.random() < .5 ? -1 : 1, t = `translate(${dir * rnd(95, 125)}px,${rnd(74, 82)}px) rotate(${dir * rnd(10, 35)}deg) scale(.5)`;
  sfx.whoosh();
  await cardEl.animate([{transform: 'none'}, {transform: `translate(${dir * 60}px,-40px) rotate(${dir * 20}deg) scale(.8)`, offset: .35}, {transform: t}],
    {duration: 550, easing: 'ease-in', fill: 'forwards'}).finished;
  const clone = cardEl.cloneNode(true);
  clone.removeAttribute('id'); clone.querySelector('text').removeAttribute('id');
  clone.style.cssText = `transform-box:fill-box;transform-origin:center;transform:${t}`;
  pile.appendChild(clone);
  if (pile.children.length > 6) pile.firstChild.remove();
  cardEl.getAnimations().forEach(a => a.cancel());
  cardEl.style.opacity = 0;
}

function burstHearts() {
  sfx.sparkle();
  for (let i = 0; i < 12; i++) {
    const h = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    h.setAttribute('d', 'M0 0 C-6 -8 -16 -2 0 10 C16 -2 6 -8 0 0Z');
    h.setAttribute('fill', ['#f27a93', '#f6a5b6', '#e85d78'][i % 3]);
    hearts.appendChild(h);
    const x = rnd(140, 400), y = rnd(700, 780), sc = rnd(1.2, 2.2);
    h.animate([{transform: `translate(${x}px,${y}px) scale(${sc})`, opacity: 0},
               {transform: `translate(${x + rnd(-20, 20)}px,${y - 60}px) scale(${sc})`, opacity: 1, offset: .2},
               {transform: `translate(${x + rnd(-40, 40)}px,${y - rnd(250, 400)}px) scale(${sc})`, opacity: 0}],
      {duration: rnd(1800, 2600), delay: i * 120, easing: 'ease-out', fill: 'forwards'}).finished.then(() => h.remove());
  }
}

  const flash = $('flash'), [rays, burst, white] = flash.children;

  const p = Math.min(1, (t - start) / HOLD);
  prog.style.width = p * 100 + '%';
  msg.textContent = `Сканирование… ${Math.round(p * 100)}%`;
  if (p < 1) { raf = requestAnimationFrame(tick); return; }
  done = true;
  scanHum(false);
  sfx.ok();
  scan.classList.remove('holding'); scan.classList.add('ok');
  msg.textContent = 'Личность подтверждена: агент Ксюша';
  navigator.vibrate?.([40, 60, 40]);
  setTimeout(async () => {
    await fade(scan, 1, 0, 500);
    scan.hidden = true;
    cartoon();
  }, 1400);
}
scan.addEventListener('pointerdown', e => {
  if (done) return;
  e.preventDefault();
  initAudio();
  scan.classList.add('holding');
  scanHum(true, HOLD / 1000);
  navigator.vibrate?.(20);
  start = performance.now();
  raf = requestAnimationFrame(tick);
});
const release = () => {
  if (done || !scan.classList.contains('holding')) return;
  cancelAnimationFrame(raf);
  scanHum(false);
  scan.classList.remove('holding');
  prog.style.width = '0';
  msg.textContent = 'Сканирование прервано. Держи палец, пока не дойдёт до 100%';
};
['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => scan.addEventListener(ev, release));
scan.addEventListener('contextmenu', e => e.preventDefault());
</script>
